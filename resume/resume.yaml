    - network: LinkedIn
      username: ziad-wdev
  custom_connections: []
  sections:
    summary:
      - >
        **Junior Full-Stack MERN Developer** focused on **React, Next.js, Node.js, and MongoDB**, building scalable web applications with **TypeScript, REST APIs, and reusable architecture**. Built a production-style **Turborepo e-commerce monorepo** with customer and admin applications, shared packages, authentication, product management, cart functionality, and Stripe checkout.

    # education section
    education:
      - institution: "SEF Academy - Remote"
        area: "**Full-Stack Web Development**"
        start_date: 2025-11
        end_date: 2026-07
        highlights:
          - "**Front-End Web Development Program:** 98.92%"
          - "**Back-End Web Development Program:** 98.78%"
          - "**Full-Stack Web Development Program:** 98.85%"
      - institution: "Faculty of Electronic Engineering, Menoufia University"
        area: "**B.Sc. Electrical, Electronics, and Communications Engineering**"
        start_date: 2023-10
        end_date: present
        highlights:
          - "**Relevant Coursework:** Data Structures & Algorithms, Digital Logic"
    # experience section
    experience:
      - institution: "SEF Academy Front-End Training - Remote"
        area: "**Front-End Web Development Trainee**"
        start_date: 2026-07
        end_date: 2026-08
        summary: ""
        highlights:
          - "Collaborated in a **team-based development environment** to build a production-style **e-commerce platform** using **React 19, Vite, TypeScript, Tailwind CSS, TanStack Query, and Turborepo**."
          - "Contributed to **customer storefront and admin dashboard development**, working with shared UI, API, and utility packages to promote reusable architecture and maintainability."
          - "Used **Git and GitHub** in a collaborative development workflow to contribute features and integrate work across the team."
          - "**Front-End Training Program:** 98.5%"
    # skills section
    skills:
      - label: Front-End
        details: HTML, CSS, JavaScript, TypeScript, React.js, Next.js, Vite, Tailwind CSS
      - label: Back-End
        details: Node.js, Express, MongoDB, REST APIs, Docker
      - label: Tools
        details: Bun, Git, GitHub, Turborepo, npm Workspaces, Vercel, Vitest
    # projects section
    projects:
      - name: E-Commerce Platform (Monorepo)
        start_date: 2026-07
        end_date: 2026-08
        summary: "**Links:** [GitHub Repo](https://github.com/team-9-frontend/e-commerce) | [Store Live Demo](https://e-commerce-store-mu-eight.vercel.app/) | [Admin Dashboard Live Demo](https://e-commerce-dashboard-rho-two.vercel.app/)"
        highlights:
          - Built a scalable **Turborepo monorepo** with **React 19, Vite, TypeScript, Tailwind CSS, and TanStack Query**, delivering customer and admin applications with shared UI, API, and utility packages.
          - Implemented authentication, product and category management, shopping cart functionality, and Stripe checkout, improving maintainability through reusable architecture.
      - name: Next.js E-Commerce Platform
        start_date: 2026-05
        end_date: 2026-06
        summary: "**Links:** [GitHub Repo](https://github.com/ziad-wdev/store) | [Live Demo](https://store-two-mu.vercel.app/)"
        highlights:
          - Built a modern e-commerce application with **Next.js 16, React 19, TypeScript, Redux Toolkit, RTK Query, and Tailwind CSS**, featuring product search, filtering, pagination, and dynamic product pages.
          - Implemented persistent **cart and wishlist** state with **Redux Persist** and integrated the **DummyJSON REST API** with client-side caching.
      - name: Personal Portfolio Website
        start_date: 2026-04
        end_date: 2026-04
        summary: "**Links:** [GitHub Repo](https://github.com/ziad-wdev/portfolio) | [Live Demo](https://ziad-wdev.vercel.app/)"
        highlights:
          - Built a responsive portfolio using **Next.js 16 and TypeScript**, integrating the **GitHub API and Microlink API** for dynamic project content.
          - Developed a production-ready contact system with **EmailJS and TanStack Form**, adding validation, notifications, theme persistence, and performance optimizations.
design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: left
    date_and_location_column_alignment: right
    font_family:
      body: Roboto
      name: Roboto
      headline: Roboto
      connections: Roboto
      section_titles: Roboto
    font_size:
      body: 10pt
      name: 24pt
      headline: 10pt
      connections: 10pt
      section_titles: 14pt
    small_caps:
      name: true
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 3.5cm
    photo_position: left
    photo_space_left: 0.4cm
    photo_space_right: 0.4cm
    space_below_name: 0.4cm
    space_below_headline: 0.4cm
    space_below_connections: 0.4cm
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: "|"
      space_between_connections: 0.5cm
  section_titles:
    type: with_partial_line
    line_thickness: 1pt
    space_above: 0.6cm
    space_below: 0.4cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.4em
    space_between_text_based_entries: 0.4em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0.12cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0cm
      space_above: 0.15cm
      space_between_items: 0.18cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: "*NAME – PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: |-
        **INSTITUTION** – LOCATION
        DEGREE_WITH_AREA
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME** – LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY** – LOCATION
        POSITION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
